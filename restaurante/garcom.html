<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Garçom – Farina</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { font-family:'Segoe UI',sans-serif; background:#111; color:#fff; max-width:480px; margin:0 auto; min-height:100vh; }

  /* Faixa italiana no topo */
  .italia-bar { height:5px; background:linear-gradient(to right, #009246 33.3%, #fff 33.3%, #fff 66.6%, #ce2b37 66.6%); }

  header { background:#0a0a0a; color:white; padding:14px 16px; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:50; box-shadow:0 2px 12px rgba(0,0,0,0.6); border-bottom:1px solid #222; }
  .header-logo { display:flex; flex-direction:column; }
  .header-logo .brand { font-size:1.2rem; font-weight:800; letter-spacing:2px; text-transform:uppercase; }
  .header-logo .brand span.g { color:#009246; }
  .header-logo .brand span.r { color:#ce2b37; }
  .header-logo .since { font-size:0.65rem; color:#888; letter-spacing:1px; text-transform:uppercase; }
  .cart-pill { background:#ce2b37; color:white; border:none; border-radius:20px; padding:7px 16px; font-weight:700; font-size:0.85rem; display:flex; align-items:center; gap:6px; cursor:pointer; }
  .cart-pill .badge { background:white; color:#ce2b37; border-radius:50%; width:18px; height:18px; display:flex; align-items:center; justify-content:center; font-size:0.7rem; font-weight:800; }

  .mesa-bar { background:#161616; padding:12px 16px; border-bottom:1px solid #222; display:flex; align-items:center; gap:10px; }
  .mesa-bar label { font-size:0.85rem; font-weight:600; color:#aaa; white-space:nowrap; }
  .mesa-bar select { flex:1; padding:8px 10px; border:1px solid #333; border-radius:8px; font-size:0.9rem; outline:none; background:#1a1a1a; color:white; }
  .mesa-bar select:focus { border-color:#ce2b37; }

  .search-bar { padding:10px 16px; background:#161616; border-bottom:1px solid #222; }
  .search-bar input { width:100%; padding:9px 12px; border:1px solid #333; border-radius:8px; font-size:0.9rem; outline:none; background:#1a1a1a; color:white; }
  .search-bar input::placeholder { color:#555; }
  .search-bar input:focus { border-color:#009246; }

  .cat-scroll { display:flex; gap:8px; padding:12px 16px; overflow-x:auto; background:#111; border-bottom:1px solid #222; }
  .cat-scroll::-webkit-scrollbar { display:none; }
  .cat-chip { white-space:nowrap; padding:6px 16px; border-radius:16px; border:1px solid #444; background:#1a1a1a; color:#ccc; font-size:0.8rem; font-weight:600; cursor:pointer; transition:all 0.2s; }
  .cat-chip.active { background:#ce2b37; color:white; border-color:#ce2b37; }

  .item-list { padding:6px 0; }
  .item-row { display:flex; align-items:center; gap:12px; padding:13px 16px; background:#161616; border-bottom:1px solid #1f1f1f; transition:background 0.2s; }
  .item-row:active { background:#1f1f1f; }
  .item-emoji { font-size:2rem; width:44px; text-align:center; }
  .item-info { flex:1; }
  .item-info h3 { font-size:0.95rem; font-weight:600; color:#fff; }
  .item-info p { font-size:0.78rem; color:#666; margin-top:2px; }
  .item-price { color:#009246; font-weight:700; font-size:0.95rem; white-space:nowrap; }
  .qty-ctrl { display:flex; align-items:center; gap:8px; }
  .qbtn { width:32px; height:32px; border-radius:50%; border:1px solid #444; background:#1a1a1a; color:#fff; font-size:1.1rem; font-weight:700; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:all 0.2s; }
  .qbtn:active { background:#ce2b37; border-color:#ce2b37; }
  .qnum { font-weight:700; min-width:18px; text-align:center; font-size:0.95rem; color:#fff; }

  .cart-row { display:flex; align-items:center; gap:10px; padding:14px 16px; background:#161616; border-bottom:1px solid #1f1f1f; }
  .cart-row-emoji { font-size:1.6rem; }
  .cart-row-info { flex:1; }
  .cart-row-info h4 { font-size:0.9rem; font-weight:600; color:#fff; }
  .cart-row-info p { font-size:0.78rem; color:#666; }
  .cart-row-price { font-weight:700; color:#009246; font-size:0.9rem; }

  .obs-block { padding:12px 16px; background:#161616; border-bottom:1px solid #222; }
  .obs-block label { font-size:0.82rem; font-weight:600; color:#aaa; display:block; margin-bottom:6px; }
  .obs-block input { width:100%; padding:9px 12px; border:1px solid #333; border-radius:8px; font-size:0.9rem; outline:none; background:#1a1a1a; color:white; }
  .obs-block input:focus { border-color:#009246; }

  .cart-total-bar { display:flex; justify-content:space-between; align-items:center; padding:16px; background:#0a0a0a; font-size:1.1rem; font-weight:700; border-top:1px solid #222; }
  .cart-total-bar span:last-child { color:#009246; }

  .send-btn { width:calc(100% - 32px); margin:14px 16px; background:#ce2b37; color:white; border:none; padding:15px; border-radius:10px; font-size:1rem; font-weight:700; cursor:pointer; display:block; letter-spacing:0.5px; }
  .send-btn:active { background:#a82230; }
  .send-btn:disabled { background:#444; cursor:not-allowed; }

  .status-msg { text-align:center; padding:50px 20px; color:#555; font-size:0.9rem; }
  .status-msg span { font-size:2.5rem; display:block; margin-bottom:10px; }

  /* Divider Italia */
  .italia-divider { height:3px; background:linear-gradient(to right, #009246 33.3%, #fff 33.3%, #fff 66.6%, #ce2b37 66.6%); margin:0; }

  .toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:#009246; color:white; padding:12px 24px; border-radius:24px; font-weight:700; font-size:0.9rem; opacity:0; transition:opacity 0.3s; pointer-events:none; white-space:nowrap; z-index:999; }
  .toast.show { opacity:1; }

  /* Tela de login garçom */
  .login-screen { position:fixed; inset:0; background:#0a0a0a; z-index:200; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:32px; }
  .login-screen .login-logo { font-size:2rem; font-weight:800; letter-spacing:4px; margin-bottom:4px; }
  .login-screen .login-logo span.g { color:#009246; }
  .login-screen .login-logo span.r { color:#ce2b37; }
  .login-screen .login-sub { font-size:0.7rem; color:#555; letter-spacing:2px; text-transform:uppercase; margin-bottom:40px; }
  .login-screen h2 { font-size:1rem; color:#aaa; margin-bottom:20px; font-weight:400; }
  .garcon-btns { display:flex; flex-direction:column; gap:10px; width:100%; max-width:320px; }
  .garcon-btn { background:#161616; border:1px solid #2a2a2a; color:#eee; padding:14px 20px; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; text-align:left; display:flex; align-items:center; gap:12px; transition:border 0.2s; }
  .garcon-btn:active { border-color:#009246; color:#009246; }
  .garcon-avatar { width:36px; height:36px; border-radius:50%; background:#1a1a1a; border:2px solid #333; display:flex; align-items:center; justify-content:center; font-size:1.1rem; }
  .garcon-tag { background:#1a1a1a; border:1px solid #333; border-radius:16px; padding:4px 12px; font-size:0.8rem; color:#aaa; display:flex; align-items:center; gap:6px; }
  .garcon-tag button { background:none; border:none; color:#ce2b37; cursor:pointer; font-size:0.9rem; }

  .back-link { text-align:center; padding-bottom:20px; }
  .back-link a { color:#ce2b37; font-size:0.85rem; font-weight:600; text-decoration:none; }
</style>
</head>
<body>

<div class="italia-bar"></div>

<header>
  <div class="header-logo">
    <div class="brand"><span class="g">FA</span>RI<span class="r">NA</span></div>
    <div class="since">Ristorante · Desde 1945</div>
  </div>
  <button class="cart-pill" onclick="goCart()">🛒 Pedido <span class="badge" id="cartBadge">0</span></button>
</header>

<div class="mesa-bar">
  <label>Mesa:</label>
  <select id="mesaSel">
    <option value="">— Selecione —</option>
    <option>Mesa 1</option><option>Mesa 2</option><option>Mesa 3</option>
    <option>Mesa 4</option><option>Mesa 5</option><option>Mesa 6</option>
    <option>Balcão</option>
  </select>
</div>
<div class="mesa-bar">
  <label>Garçom:</label>
  <select id="garcomSel">
    <option value="">— Selecione —</option>
  </select>
</div>

<div id="viewCardapio">
  <div class="search-bar"><input type="text" id="searchInput" placeholder="🔍 Buscar item..." oninput="renderItems()"></div>
  <div class="cat-scroll" id="catScroll"></div>
  <div class="italia-divider"></div>
  <div class="item-list" id="itemList">
    <div class="status-msg"><span>⏳</span>Carregando cardápio...</div>
  </div>
</div>

<div id="viewCarrinho" style="display:none">
  <div class="italia-divider"></div>
  <div id="cartRows"></div>
  <div class="obs-block">
    <label>Observações (opcional)</label>
    <input type="text" id="obsInput" placeholder="Ex: sem cebola, ponto da carne...">
  </div>
  <div class="cart-total-bar"><span>Total</span><span id="totalVal">R$ 0,00</span></div>
  <button class="send-btn" id="sendBtn" onclick="sendOrder()">✅ Enviar para Cozinha</button>
  <div class="back-link"><a href="#" onclick="goCardapio();return false;">← Voltar ao cardápio</a></div>
</div>

<div class="toast" id="toast">Pedido enviado! 🎉</div>

<script>
var DB = 'https://restaurante-farina-default-rtdb.firebaseio.com';
var garcomAtual = '';

var DEFAULT_MENU = [
  { id:1, cat:'Entradas', name:'Bruschetta', desc:'Pão tostado com tomate e manjericão', price:18, emoji:'🥖', active:true },
  { id:2, cat:'Entradas', name:'Carpaccio', desc:'Carne bovina com parmesão e rúcula', price:32, emoji:'🥩', active:true },
  { id:3, cat:'Entradas', name:'Sopa do Dia', desc:'Pergunte ao garçom', price:22, emoji:'🍲', active:true },
  { id:4, cat:'Massas', name:'Spaghetti Bolonhesa', desc:'Molho de carne moída', price:42, emoji:'🍝', active:true },
  { id:5, cat:'Massas', name:'Fettuccine ao Pesto', desc:'Pesto de manjericão fresco', price:38, emoji:'🍜', active:true },
  { id:6, cat:'Massas', name:'Lasanha da Casa', desc:'Massa, queijo e molho especial', price:45, emoji:'🫕', active:true },
  { id:7, cat:'Carnes', name:'Filé ao Molho Madeira', desc:'Filé mignon grelhado', price:68, emoji:'🥩', active:true },
  { id:8, cat:'Carnes', name:'Costelinha BBQ', desc:'Molho barbecue defumado', price:55, emoji:'🍖', active:true },
  { id:9, cat:'Pizzas', name:'Margherita', desc:'Molho, muçarela e manjericão', price:48, emoji:'🍕', active:true },
  { id:10, cat:'Pizzas', name:'Quatro Queijos', desc:'Muçarela, parmesão, gorgonzola, catupiry', price:52, emoji:'🍕', active:true },
  { id:11, cat:'Bebidas', name:'Suco Natural', desc:'Laranja, limão ou maracujá', price:12, emoji:'🍊', active:true },
  { id:12, cat:'Bebidas', name:'Refrigerante', desc:'Coca, Guaraná ou Soda', price:8, emoji:'🥤', active:true },
  { id:13, cat:'Bebidas', name:'Água Mineral', desc:'Com ou sem gás', price:6, emoji:'💧', active:true },
  { id:14, cat:'Sobremesas', name:'Tiramisu', desc:'Café e mascarpone', price:28, emoji:'🍰', active:true },
  { id:15, cat:'Sobremesas', name:'Petit Gâteau', desc:'Bolo quente com sorvete', price:32, emoji:'🎂', active:true }
];

var MENU = [], CATS = ['Todos'], cart = {}, currentCat = 'Todos';
function fmt(v){ return 'R$ '+v.toFixed(2).replace('.',','); }

function loadGarcons(){
  fetch(DB+'/garcons.json').then(function(r){return r.json();}).then(function(data){
    var lista = (data && Array.isArray(data)) ? data.filter(function(g){return g;}) : [];
    var sel = document.getElementById('garcomSel');
    sel.innerHTML = '<option value="">— Selecione —</option>';
    lista.forEach(function(g){
      var opt = document.createElement('option');
      opt.value = g; opt.textContent = g;
      sel.appendChild(opt);
    });
  }).catch(function(){});
}

function loadData(){
  fetch(DB+'/config.json').then(function(r){return r.json();}).then(function(c){
    if(c && c.name){
      document.querySelector('.brand').innerHTML = c.name.toUpperCase().replace(/(.{2})(.*)(.{2})/, '<span class="g">$1</span>$2<span class="r">$3</span>');
    }
  }).catch(function(){});
  fetch(DB+'/menu.json').then(function(r){return r.json();}).then(function(data){
    MENU = data ? Object.values(data).filter(function(i){return i.active!==false;}) : DEFAULT_MENU.slice();
    var cs={};MENU.forEach(function(i){cs[i.cat]=true;});
    CATS=['Todos'].concat(Object.keys(cs));
    currentCat='Todos'; renderCats(); renderItems();
  }).catch(function(){
    MENU=DEFAULT_MENU.slice();
    var cs={};MENU.forEach(function(i){cs[i.cat]=true;});
    CATS=['Todos'].concat(Object.keys(cs));
    renderCats(); renderItems();
  });
}

function renderCats(){
  document.getElementById('catScroll').innerHTML=CATS.map(function(c){
    return '<div class="cat-chip '+(c===currentCat?'active':'')+'" onclick="selectCat(\''+c+'\')">'+c+'</div>';
  }).join('');
}
function selectCat(c){currentCat=c;renderCats();renderItems();}

function renderItems(){
  var q=document.getElementById('searchInput').value.toLowerCase();
  var items=currentCat==='Todos'?MENU:MENU.filter(function(i){return i.cat===currentCat;});
  if(q) items=items.filter(function(i){return i.name.toLowerCase().indexOf(q)>=0||i.desc.toLowerCase().indexOf(q)>=0;});
  if(!items.length){document.getElementById('itemList').innerHTML='<div class="status-msg">Nenhum item encontrado.</div>';return;}
  document.getElementById('itemList').innerHTML=items.map(function(item){
    var qty=cart[item.id]||0;
    return '<div class="item-row">'
      +'<div class="item-emoji">'+item.emoji+'</div>'
      +'<div class="item-info"><h3>'+item.name+'</h3><p>'+item.desc+'</p></div>'
      +'<div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px">'
      +'<span class="item-price">'+fmt(item.price)+'</span>'
      +'<div class="qty-ctrl">'
      +'<button class="qbtn" onclick="chg('+item.id+',-1)">−</button>'
      +'<span class="qnum">'+qty+'</span>'
      +'<button class="qbtn" onclick="chg('+item.id+',1)">+</button>'
      +'</div></div></div>';
  }).join('');
}

function chg(id,d){cart[id]=Math.max(0,(cart[id]||0)+d);updateBadge();renderItems();}
function updateBadge(){document.getElementById('cartBadge').textContent=Object.values(cart).reduce(function(a,b){return a+b;},0);}
function cartItems(){return Object.entries(cart).filter(function(e){return e[1]>0;});}
function total(){return cartItems().reduce(function(s,e){var it=MENU.find(function(i){return i.id==e[0];});return s+(it?it.price*e[1]:0);},0);}

function goCart(){
  if(!cartItems().length){alert('Adicione itens ao pedido primeiro!');return;}
  document.getElementById('cartRows').innerHTML=cartItems().map(function(e){
    var it=MENU.find(function(i){return i.id==e[0];});
    return '<div class="cart-row"><span class="cart-row-emoji">'+it.emoji+'</span>'
      +'<div class="cart-row-info"><h4>'+it.name+'</h4><p>'+e[1]+'x '+fmt(it.price)+'</p></div>'
      +'<span class="cart-row-price">'+fmt(it.price*e[1])+'</span></div>';
  }).join('');
  document.getElementById('totalVal').textContent=fmt(total());
  document.getElementById('viewCardapio').style.display='none';
  document.getElementById('viewCarrinho').style.display='block';
}
function goCardapio(){document.getElementById('viewCarrinho').style.display='none';document.getElementById('viewCardapio').style.display='block';}

function sendOrder(){
  var mesa=document.getElementById('mesaSel').value;
  var garcom=document.getElementById('garcomSel').value;
  if(!mesa){alert('Selecione a mesa antes de enviar!');return;}
  if(!garcom){alert('Selecione o garçom antes de enviar!');return;}
  var btn=document.getElementById('sendBtn');btn.disabled=true;btn.textContent='Enviando...';
  var items=cartItems().map(function(e){var it=MENU.find(function(i){return i.id==e[0];});return{name:it.name,emoji:it.emoji,qty:e[1],price:it.price};});
  var order={mesa:mesa,garcom:garcom,obs:document.getElementById('obsInput').value,items:items,total:total(),status:'pending',time:new Date().toISOString()};
  fetch(DB+'/orders.json',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(order)})
    .then(function(){
      cart={};document.getElementById('obsInput').value='';document.getElementById('mesaSel').value='';document.getElementById('garcomSel').value='';
      updateBadge();goCardapio();renderItems();
      var t=document.getElementById('toast');t.classList.add('show');setTimeout(function(){t.classList.remove('show');},3000);
    }).catch(function(){alert('Erro ao enviar. Verifique a conexão.');})
    .finally(function(){btn.disabled=false;btn.textContent='✅ Enviar para Cozinha';});
}
loadGarcons();
loadData();
</script>
</body>
</html>
